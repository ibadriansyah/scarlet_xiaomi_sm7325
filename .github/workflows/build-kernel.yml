name: Build Kernel (Redwood)

on:
  workflow_dispatch: # Memungkinkan kamu menjalankan build secara manual dari tab Actions
  push:
    branches:
      - main
      - redwood # Sesuaikan dengan branch utama kamu

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update -y && sudo apt upgrade -y && sudo apt install nano bc bison ca-certificates curl flex gcc git libc6-dev libssl-dev openssl python-is-python3 ssh wget zip zstd sudo make clang gcc-arm-linux-gnueabi software-properties-common build-essential libarchive-tools gcc-aarch64-linux-gnu -y && sudo apt install build-essential -y && sudo apt install libssl-dev libffi-dev libncurses5-dev zlib1g zlib1g-dev libreadline-dev libbz2-dev libsqlite3-dev make gcc -y && sudo apt install pigz -y && sudo apt install python2 -y && sudo apt install python3 -y && sudo apt install cpio -y && sudo apt install lld -y && sudo apt install llvm -y && sudo apt-get install g++-aarch64-linux-gnu -y && sudo apt install libelf-dev -y && sudo apt install neofetch -y && neofetch

      - name: Setup AOSP Clang 20 (r547379)
        run: |
          echo "Setting up AOSP Clang 20.0.0 (r547379)..."
          mkdir -p $HOME/toolchains/aosp-clang
          cd $HOME/toolchains/aosp-clang
          
          # Mengunduh langsung r547379 dari repositori resmi Google Git (Android 15 branch)
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r1/clang-r547379.tar.gz
          tar -xzf clang-r547379.tar.gz
          rm clang-r547379.tar.gz
          
          # Verifikasi versi Clang
          ./bin/clang --version

      - name: Run Build Script
        run: |
          # Pastikan file script build kamu bernama build.sh (ubah jika namanya berbeda)
          chmod +x build.sh
          ./build.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Salsa-Kernel-Redwood
          path: /home/runner/AnyKernel3/*.zip
          compression-level: 0 # File sudah dalam bentuk zip, tidak perlu dikompresi dua kali
